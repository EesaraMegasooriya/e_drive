spring.application.name=drive

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_DATABASE:drive}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:eesara123}

spring.docker.compose.enabled=false
spring.flyway.enabled=false

# JWT
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY
app.jwt.expiration=86400000

# Password reset email (Resend)
# Set APP_RESEND_API_KEY and APP_RESEND_FROM in the environment before use.
app.resend.api-key=${APP_RESEND_API_KEY:}
app.resend.from=${APP_RESEND_FROM:EDrive <onboarding@resend.dev>}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Storage
drive.storage.path=/Users/eesaramegasooriya/E-Drive/storage

storage.location=storage

spring.servlet.multipart.max-file-size=100GB
spring.servlet.multipart.max-request-size=100GB

server.tomcat.connection-timeout=600000
server.tomcat.keep-alive-timeout=600000
server.tomcat.max-swallow-size=-1

spring.mvc.async.request-timeout=3600000

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=DEBUG
