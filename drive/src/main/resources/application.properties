spring.application.name=drive
server.port=8080
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}

spring.datasource.url=jdbc\:mysql://${DB\_HOST\:localhost}:3306/${DB\_DATABASE\:drive}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:eesara123}

spring.docker.compose.enabled=false
spring.flyway.enabled=false

# JWT
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY
app.jwt.expiration=86400000

# Password reset email (Resend)
# Set APP_RESEND_API_KEY and APP_RESEND_FROM in the environment before use.
app.resend.api-key=${APP_RESEND_API_KEY:}
app.resend.from=${APP_RESEND_FROM:EDrive <onboarding@resend.dev>}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Storage
storage.location=${STORAGE_LOCATION:storage}

spring.servlet.multipart.max-file-size=15GB
spring.servlet.multipart.max-request-size=15GB
# Store multipart temporary files on the upload volume, not in the container's
# small writable layer. This is essential for large uploads in Docker.
spring.servlet.multipart.location=${STORAGE_LOCATION:storage}/.tmp

server.tomcat.connection-timeout=12h
server.tomcat.keep-alive-timeout=12h
server.tomcat.max-swallow-size=-1

spring.mvc.async.request-timeout=12h

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=DEBUG
